<!DOCTYPE html>
<html>
<head>
    <title>Horror Player</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- The Entity -->
    <div id="entity" class="entity">
    <img src="../image/entity.png" alt="" class="entity-image">
</div>

<div id="entityMessage" class="entity-message"></div>

    <!-- YouTube player -->
    <div id="playerContainer" class="hidden">
        <div id="player"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button id="playButton">Play</button>
        <button id="pauseButton">Pause</button>
        <button id="volumeButton">Volume +</button>
        <button id="volumeDownButton">Volume -</button>
    </div>

    <script src="../JS/videoController.js"></script>

</body>
</html>
