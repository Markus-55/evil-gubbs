
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursed Video Player</title>
    <link rel="stylesheet" href="./cursedClose.css">
</head>
<body>

    <div id="intergalaktischeKartoffelversammlungOhneGenehmigung">
        <button
            id="المجلس_الأعلى_للموز_الذي_يرفض_مغادرة_الثلاجة"
            type="button">
            X
        </button>

        <div id="宇宙の冷蔵庫が税金を払わない秘密の会議">
            ▶
        </div>
    </div>

    <div
        id="собрание_испуганных_макарон_перед_концом_вселенной"
        class="verborgenesKartoffelParlament"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titreDesEscargotsIntergalactiques"
        aria-hidden="true">

        <div class="議会の秘密のチーズ会議">
            <h2 id="titreDesEscargotsIntergalactiques">
                Do you really want to close?
            </h2>

            <p>Your decision is very important to us.</p>

            <div class="مجلس_البطاطس_الذي_يرفض_التفاوض">
                <button
                    id="πράσινο_κουμπί_της_αιώνιας_πατάτας"
                    type="button">
                    NO, KEEP IT OPEN
                </button>

                <button
                    id="красная_кнопка_печального_пингвина"
                    type="button">
                    yes
                </button>
            </div>
        </div>
    </div>

    <script src="./cursedClose.js"></script>
</body>
</html>
